<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Slide Style Library — Offline Archive v6</title><style>
:root{--bg:#f6f4ef;--ink:#171717;--muted:#6d6a64;--card:#fff;--line:#dedbd4;--accent:#f0b04e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}header{padding:40px clamp(20px,5vw,72px) 28px;background:#151515;color:#fff}header h1{font-size:clamp(30px,5vw,64px);margin:0 0 10px;letter-spacing:-.04em}header p{max-width:900px;margin:0;color:#c9c7c1;line-height:1.7}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:7px 10px;border:1px solid #ffffff2a;border-radius:999px;font-size:12px}.pill.good{background:#173f2a}.pill.warn{background:#5b3c12}.tools{position:sticky;top:0;z-index:5;padding:12px clamp(20px,5vw,72px);display:flex;gap:10px;flex-wrap:wrap;background:#f6f4efed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}input,select{padding:11px 12px;border:1px solid #c9c5bc;border-radius:10px;background:#fff;font:inherit}.count{align-self:center;color:var(--muted);font-size:13px}.grid{padding:24px clamp(20px,5vw,72px) 72px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px #00000012}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#eee}.meta{padding:13px}.id{font:11px ui-monospace;color:#888}.name{font-size:17px;font-weight:760;margin-top:2px}.cat{font-size:12px;color:#777;margin-top:4px}.badge{display:inline-block;margin-top:9px;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:700;background:#e8f4eb;color:#245a36}.badge.fallback{background:#fff0d8;color:#7b5316}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.on{display:flex}.box{width:min(1160px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.top{display:flex;justify-content:space-between;gap:20px}.close{border:0;background:none;font-size:30px;cursor:pointer}.hero{width:100%;border-radius:14px;border:1px solid #ddd}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}.tabs button{padding:9px 12px;border:1px solid #bbb;background:#fff;border-radius:9px;cursor:pointer}.status{padding:10px 12px;border-radius:10px;background:#eef6ef;font-size:12px}.status.warn{background:#fff3d8}.yaml{white-space:pre-wrap;word-break:break-word;background:#121212;color:#f2f2f2;padding:16px;border-radius:12px;max-height:480px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}footer{padding:24px clamp(20px,5vw,72px);color:#777;font-size:12px;border-top:1px solid var(--line)}</style></head><body>
<header><h1>Slide Style Library</h1><p>元サイト閉鎖後も使えるローカル保存版。画像160枚はZIP内に実体保存済み。Original YAMLはモーダルのID・名称まで照合し、155件を検証済みとして保存しています。</p><div class="summary"><span class="pill good">画像 160 / 160 LOCAL</span><span class="pill good">Original YAML 155 / 160 VERIFIED</span><span class="pill warn">要再取得 5</span><span class="pill good">Reconstructed 160 / 160</span></div></header>
<div class="tools"><input id="q" placeholder="スタイル名・カテゴリ・YAMLを検索"><select id="cat"><option value="">すべてのカテゴリ</option></select><select id="statusFilter"><option value="">すべて</option><option value="original">Original確認済み</option><option value="fallback">要再取得</option></select><span id="count" class="count"></span></div><main id="grid" class="grid"></main>
<div id="modal" class="modal"><div class="box"><div class="top"><div><div id="mid" class="id"></div><h2 id="mname"></h2></div><button class="close" onclick="closeM()">×</button></div><img id="mimg" class="hero"><div class="tabs"><button onclick="showY('best')">BEST AVAILABLE</button><button onclick="showY('original')">ORIGINAL</button><button onclick="showY('reconstructed')">RECONSTRUCTED</button><button onclick="copyY()">YAMLをコピー</button></div><div id="mstatus" class="status"></div><pre id="yaml" class="yaml"></pre></div></div>
<footer>Archive v6 audited · Runtime external dependency: none · See AUDIT.json for validation details.</footer><script src="data/archive-data.js"></script><script>
const DATA=window.ARCHIVE_DATA||[];let current=null,currentText='';const q=document.getElementById('q'),cat=document.getElementById('cat'),sf=document.getElementById('statusFilter'),grid=document.getElementById('grid'),count=document.getElementById('count');[...new Set(DATA.map(x=>x.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;cat.appendChild(o)});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const s=q.value.toLowerCase(),c=cat.value,f=sf.value;const rows=DATA.filter(x=>(!c||x.category===c)&&(!f||(f==='original'&&x.originalYaml)||(f==='fallback'&&!x.originalYaml))&&(!s||(x.name+' '+x.category+' '+(x.originalYaml||'')+' '+(x.reconstructedYaml||'')).toLowerCase().includes(s)));count.textContent=rows.length+' / '+DATA.length;grid.innerHTML=rows.map(x=>`<article class="card" data-id="${x.id}"><img loading="lazy" src="${x.localImagePath}"><div class="meta"><div class="id">${x.id}</div><div class="name">${esc(x.name)}</div><div class="cat">${esc(x.category)}</div><span class="badge ${x.originalYaml?'':'fallback'}">${x.originalYaml?'ORIGINAL VERIFIED':'RECONSTRUCTED FALLBACK'}</span></div></article>`).join('');grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openM(el.dataset.id))}function openM(id){current=DATA.find(x=>x.id===id);document.getElementById('mid').textContent=current.id+' / '+current.category;document.getElementById('mname').textContent=current.name;document.getElementById('mimg').src=current.localImagePath;document.getElementById('modal').classList.add('on');showY('best')}function closeM(){document.getElementById('modal').classList.remove('on')}function showY(mode){if(!current)return;const orig=current.originalYaml,rec=current.reconstructedYaml||'';currentText=mode==='original'?(orig||'# Original YAML は再取得対象です。
# 現在は復元版のみ安全に利用できます。'):(mode==='reconstructed'?rec:(orig||rec));const st=document.getElementById('mstatus');st.className='status'+(orig?'':' warn');st.textContent=orig?'Original YAML: 元ギャラリーで表示された DESIGN STYLE 番号・スタイル名がこのレコードと一致することを監査済み。':'Original YAML: 誤紐付けを検出したため隔離。BEST AVAILABLEでは復元YAMLを表示しています。';document.getElementById('yaml').textContent=currentText}async function copyY(){try{await navigator.clipboard.writeText(currentText)}catch{prompt('コピーしてください',currentText)}}q.oninput=render;cat.onchange=render;sf.onchange=render;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
