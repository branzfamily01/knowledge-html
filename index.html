<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>My Hub — Knowledge, Apps & Tools</title>
  <meta name="description" content="Knowledge、Webアプリ、ツールをひとつの入口から探して開く個人用Webライブラリ。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <header class="hero shell">
    <div class="brand-row">
      <div>
        <p class="eyebrow">PERSONAL WEB INDEX</p>
        <h1>My Hub</h1>
        <p class="subtitle">Knowledge, Apps &amp; Tools</p>
      </div>
      <div class="status-pill" id="syncStatus" aria-live="polite">
        <span class="status-dot"></span>
        <span>Loading catalog…</span>
      </div>
    </div>

    <div class="stats" aria-label="登録件数">
      <div class="stat-card">
        <span class="stat-label">ALL</span>
        <strong id="statAll">—</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">KNOWLEDGE</span>
        <strong id="statKnowledge">—</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">APPS</span>
        <strong id="statApps">—</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">FAVORITES</span>
        <strong id="statFavorites">0</strong>
      </div>
    </div>
  </header>

  <main class="shell main-shell">
    <section class="command-panel" aria-label="検索と絞り込み">
      <label class="search-box" for="searchInput">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="名前・用途・タグで検索" autocomplete="off">
        <kbd>⌘ K</kbd>
      </label>

      <div class="toolbar">
        <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="種類で絞り込み">
          <button class="tab is-active" data-filter="all" type="button">すべて</button>
          <button class="tab" data-filter="favorites" type="button">★ お気に入り</button>
          <button class="tab" data-filter="knowledge" type="button">Knowledge</button>
          <button class="tab" data-filter="apps" type="button">Web Apps</button>
          <button class="tab" data-filter="Learning" type="button">Learning</button>
          <button class="tab" data-filter="Tools" type="button">Tools</button>
          <button class="tab" data-filter="AI" type="button">AI</button>
          <button class="tab" data-filter="Productivity" type="button">Productivity</button>
        </div>

        <button id="copyListButton" class="soft-button" type="button" title="現在表示中のURL一覧をコピー">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2M6 9h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/></svg>
          URL一覧をコピー
        </button>
      </div>
    </section>

    <section class="catalog-head">
      <div>
        <p class="section-kicker">LIBRARY</p>
        <h2 id="resultHeading">すべて</h2>
      </div>
      <p class="result-count" id="resultCount">0 items</p>
    </section>

    <section class="card-grid" id="cardGrid" aria-live="polite"></section>

    <section class="empty-state" id="emptyState" hidden>
      <div class="empty-icon">⌕</div>
      <h3>見つかりませんでした</h3>
      <p>検索語を短くするか、「すべて」に戻してみてください。</p>
    </section>
  </main>

  <footer class="shell footer">
    <div>
      <strong>My Hub</strong>
      <span>GitHubは保存場所。My Hubは入口。</span>
    </div>
    <button type="button" id="reloadButton" class="text-button">↻ 最新情報を再読込</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="cardTemplate">
    <article class="hub-card">
      <div class="card-accent"></div>
      <div class="card-topline">
        <div class="type-badge"></div>
        <button class="favorite-button" type="button" aria-label="お気に入りに追加">☆</button>
      </div>
      <div class="card-icon" aria-hidden="true"></div>
      <h3 class="card-title"></h3>
      <p class="card-summary"></p>
      <div class="tag-row"></div>
      <div class="card-meta"></div>
      <div class="card-actions">
        <button class="copy-button" type="button">URLをコピー</button>
        <a class="open-button" target="_blank" rel="noopener noreferrer">開く <span aria-hidden="true">↗</span></a>
      </div>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
